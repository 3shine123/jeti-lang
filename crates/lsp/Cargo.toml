[package]
name = "jeti-lsp"
version = "0.0.8"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "jeti_lsp"
path = "src/lib.rs"

[[bin]]
name = "jeti-lsp"
path = "src/main.rs"

[dependencies]
jeti-ast = { path = "../ast" }
jeti-cst = { path = "../cst" }
jetic = { path = "../jetic" }
jeti-checker = { path = "../checker" }
jeti-layout = { path = "../layout" }
serde_json = "1.0.154"

[dev-dependencies]
# Strict LSP shape check for the advertised capabilities: clients like Zed
# deserialize the `initialize` response into typed structs and reject it
# wholesale on a shape violation, which VS Code's lenient client hides.
lsp-types = "0.97"
